<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEPSE Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <header class="topbar">
    <h1>NEPSE Dashboard</h1>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="portfolio.html">Portfolio</a>
    </nav>
  </header>

  <main class="dashboard-grid">

    <!-- Market Summary -->
    <section class="card index-card">
      <h2>Market Summary</h2>
      <div id="indexSummary" class="index-summary">
        <p class="loading">Loading index...</p>
      </div>
    </section>

    <!-- Top Gainers -->
    <section class="card">
      <h2>Top Gainers</h2>
      <table id="gainersTable">
        <thead>
          <tr><th>Symbol</th><th>LTP</th><th>Change %</th></tr>
        </thead>
        <tbody>
          <tr><td colspan="3" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Top Losers -->
    <section class="card">
      <h2>Top Losers</h2>
      <table id="losersTable">
        <thead>
          <tr><th>Symbol</th><th>LTP</th><th>Change %</th></tr>
        </thead>
        <tbody>
          <tr><td colspan="3" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Portfolio Snapshot (pulls summary only, full detail lives in portfolio.js/html) -->
    <section class="card">
      <h2>Portfolio Snapshot</h2>
      <div id="portfolioSnapshot">
        <p class="loading">Loading portfolio...</p>
      </div>
      <a href="portfolio.html" class="view-link">View full portfolio →</a>
    </section>

  </main>

  <footer>
    <p>Data refreshed manually / via script. Not real-time.</p>
  </footer>

  <!-- Separate files: dashboard.js handles market data, portfolio.js (your existing file) handles portfolio -->
  <script src="dashboard.js"></script>
  <script src="portfolio.js"></script>

  <!-- Purely presentational: subtle 3D tilt for glass cards. Does not touch data/logic. -->
  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (window.matchMedia('(hover: none)').matches) return; // skip on touch devices

      var cards = document.querySelectorAll('.card');

      cards.forEach(function (card) {
        var frame = null;

        card.addEventListener('mousemove', function (e) {
          if (frame) return;
          frame = requestAnimationFrame(function () {
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;

            var px = x / rect.width;
            var py = y / rect.height;

            var rotateY = (px - 0.5) * 6;   // max ~3deg either side
            var rotateX = (0.5 - py) * 6;

            card.style.transform =
              'translateY(-6px) translateZ(18px) rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg)';

            card.style.setProperty('--mouse-x', (px * 100).toFixed(1) + '%');
            card.style.setProperty('--mouse-y', (py * 100).toFixed(1) + '%');

            frame = null;
          });
        });

        card.addEventListener('mouseleave', function () {
          card.style.transform = '';
        });
      });
    })();
  </script>
</body>
</html>
