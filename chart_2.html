<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NEPSE Chart</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0B0E11; color: #EDEFF1;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; padding: 28px 20px 60px;
  }
  .label { font-family: 'Inter', sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  .ee-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-family: 'Inter', sans-serif; }
  .ee-mark { width: 26px; height: 26px; border-radius: 7px; background: #3FA796; color: #0B0E11; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .ee-brand-text { font-size: 12px; color: #6B7680; letter-spacing: .04em; }
  .ee-brand-text b { color: #EDEFF1; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
  .symbol-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .symbol-row input {
    background: #14181C; border: 1px solid #2A3138; border-radius: 7px; padding: 10px 12px;
    color: #EDEFF1; font-family: inherit; font-size: 15px; font-weight: 600; width: 140px; text-transform: uppercase;
  }
  .symbol-row input:focus { outline: none; border-color: #3FA796; }
  button { font-family: inherit; cursor: pointer; }
  .btn { display: flex; align-items: center; gap: 6px; background: #1D2329; border: 1px solid #2A3138; color: #EDEFF1; padding: 9px 14px; border-radius: 7px; font-size: 13px; }
  .btn:hover { border-color: #3A424B; }
  .btn.primary { background: #3FA796; border-color: #3FA796; color: #0D1210; font-weight: 600; }
  .btn.active { background: #1D2329; border-color: #3FA796; color: #3FA796; }

  .range-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .range-row .btn { padding: 7px 12px; font-size: 12px; }

  .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar .sep { width: 1px; height: 22px; background: #2A3138; margin: 0 4px; }
  .tool-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: #1D2329; border: 1px solid #2A3138; color: #9BA3AB; border-radius: 7px; padding: 0; }
  .tool-btn:hover { border-color: #3A424B; color: #EDEFF1; }
  .tool-btn.active { background: #133932; border-color: #3FA796; color: #3FA796; }
  .tool-btn svg { width: 16px; height: 16px; }
  .tool-btn.danger:hover { border-color: #C4553D; color: #E8998A; }

  #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  .chart-stack { position: relative; }
  .chart-stack.drawing-mode #drawCanvas { pointer-events: auto; cursor: crosshair; }
  #chartStatus { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #1A1F24; z-index: 5; }
  #chartStatus.show { display: flex; }

  .price-info { font-family: 'Inter', sans-serif; }
  .price-info .last { font-size: 28px; font-weight: 600; }
  .price-info .chg { font-size: 13px; margin-top: 4px; }
  .up { color: #3FA796; } .down { color: #C4553D; }

  .chart-card { background: #1A1F24; border: 1px solid #2A3138; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  #chart { width: 100%; height: 460px; }
  #volChart { width: 100%; height: 110px; margin-top: 6px; }

  .status { font-family: 'Inter', sans-serif; font-size: 13px; color: #6B7680; text-align: center; padding: 60px 20px; }
  .status.err { color: #E8998A; }

  .footer-note { font-size: 11px; color: #4A5158; margin-top: 20px; text-align: center; font-family: 'Inter', sans-serif; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ee-brand">
    <div class="ee-mark">EE</div>
    <div class="ee-brand-text"><b>Elite Elliott</b> · Charts</div>
  </div>

  <div class="header">
    <div>
      <div class="symbol-row">
        <input type="text" id="symbolInput" value="RAWA" placeholder="SYMBOL" />
        <button class="btn primary label" id="loadBtn">↻ Load</button>
      </div>
      <div class="price-info" id="priceInfo" style="margin-top:12px;">
        <div class="last" id="lastPrice">—</div>
        <div class="chg" id="chgLine"></div>
      </div>
    </div>
    <div class="range-row" id="rangeRow">
      <button class="btn label" data-days="90">3M</button>
      <button class="btn label" data-days="180">6M</button>
      <button class="btn label active" data-days="365">1Y</button>
      <button class="btn label" data-days="730">2Y</button>
      <button class="btn label" data-days="0">All</button>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="tool-btn active label" id="toolCursor" title="Cursor / Select" data-tool="cursor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3l7 17 2-7 7-2-16-8z"/></svg>
    </button>
    <button class="tool-btn label" id="toolTrend" title="Trendline" data-tool="trend">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><line x1="6.5" y1="17.5" x2="17.5" y2="6.5"/></svg>
    </button>
    <button class="tool-btn label" id="toolFib" title="Fibonacci Retracement" data-tool="fib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="5" x2="21" y2="5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="3" y1="20" x2="21" y2="20"/></svg>
    </button>
    <button class="tool-btn label" id="toolHline" title="Horizontal Ray" data-tool="hline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><circle cx="6" cy="12" r="2" fill="currentColor"/></svg>
    </button>
    <button class="tool-btn label" id="toolText" title="Text Label" data-tool="text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,7 4,4 20,4 20,7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tool-btn danger label" id="toolClear" title="Clear all drawings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
  </div>

  <div class="chart-card">
    <div class="chart-stack" id="chartStack">
      <div id="chart"></div>
      <canvas id="drawCanvas"></canvas>
      <div id="chartStatus"><div class="status" id="chartStatusText"></div></div>
    </div>
    <div id="volChart"></div>
  </div>

  <div class="footer-note">
    Daily OHLC, proxied through a Worker from nepsetrading.com's public chart feed — unofficial, verify before trading decisions.
  </div>
</div>

<script>
const WORKER_URL = "https://nepsechart.bharatiaashish43.workers.dev";

let allCandles = [];
let chart, series, volChart, volSeries;
let rangeDays = 365;
let currentSymbol = "";

// ---------- Drawing tools ----------
const drawCanvas = document.getElementById("drawCanvas");
const chartStack = document.getElementById("chartStack");
const dctx = drawCanvas.getContext("2d");
let drawings = [];       // committed drawings for current symbol
let activeTool = "cursor";
let pendingPoints = [];  // points collected for the drawing currently being placed
let hoverPoint = null;   // live cursor position for preview line

const FIB_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
const FIB_COLORS = ["#6B7680", "#3FA796", "#5AC8A8", "#E8C468", "#E89A68", "#C4553D", "#6B7680"];

function storageKey(sym) { return "ee_drawings_" + sym; }

function loadDrawings(sym) {
  try {
    const raw = localStorage.getItem(storageKey(sym));
    drawings = raw ? JSON.parse(raw) : [];
  } catch { drawings = []; }
}

function saveDrawings() {
  try { localStorage.setItem(storageKey(currentSymbol), JSON.stringify(drawings)); } catch {}
}

function setActiveTool(tool) {
  activeTool = tool;
  pendingPoints = [];
  document.querySelectorAll(".tool-btn[data-tool]").forEach((b) => {
    b.classList.toggle("active", b.dataset.tool === tool);
  });
  chartStack.classList.toggle("drawing-mode", tool !== "cursor");
  redrawOverlay();
}

function resizeCanvas() {
  const rect = document.getElementById("chart").getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  drawCanvas.width = rect.width * dpr;
  drawCanvas.height = rect.height * dpr;
  drawCanvas.style.width = rect.width + "px";
  drawCanvas.style.height = rect.height + "px";
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawOverlay();
}

function timeToX(time) {
  const x = chart.timeScale().timeToCoordinate(time);
  return x;
}
function priceToY(price) {
  return series.priceToCoordinate(price);
}
function xToTime(x) {
  return chart.timeScale().coordinateToTime(x);
}
function yToPrice(y) {
  return series.coordinateToPrice(y);
}

function drawLine(x1, y1, x2, y2, color, width = 1.5, dash = []) {
  dctx.save();
  dctx.strokeStyle = color;
  dctx.lineWidth = width;
  dctx.setLineDash(dash);
  dctx.beginPath();
  dctx.moveTo(x1, y1);
  dctx.lineTo(x2, y2);
  dctx.stroke();
  dctx.restore();
}

function drawDot(x, y, color) {
  dctx.save();
  dctx.fillStyle = color;
  dctx.beginPath();
  dctx.arc(x, y, 3.5, 0, Math.PI * 2);
  dctx.fill();
  dctx.restore();
}

function drawLabel(x, y, text, color) {
  dctx.save();
  dctx.font = "11px 'IBM Plex Mono', monospace";
  dctx.fillStyle = color;
  dctx.textBaseline = "middle";
  dctx.fillText(text, x + 6, y);
  dctx.restore();
}

function redrawOverlay() {
  if (!chart || !series) return;
  const rect = document.getElementById("chart").getBoundingClientRect();
  dctx.clearRect(0, 0, rect.width, rect.height);

  drawings.forEach((d) => renderDrawing(d, rect));

  // live preview of the drawing being placed
  if (pendingPoints.length && hoverPoint) {
    const preview = { type: activeTool, points: [...pendingPoints, hoverPoint] };
    if (activeTool === "trend" || activeTool === "fib") {
      renderDrawing(preview, rect, true);
    }
  }
}

function renderDrawing(d, rect, isPreview = false) {
  const alpha = isPreview ? 0.6 : 1;
  if (d.type === "trend") {
    const [p1, p2] = d.points;
    const x1 = timeToX(p1.time), y1 = priceToY(p1.price);
    const x2 = timeToX(p2.time), y2 = priceToY(p2.price);
    if (x1 === null || y1 === null || x2 === null || y2 === null) return;
    dctx.globalAlpha = alpha;
    drawLine(x1, y1, x2, y2, "#3FA796", 1.75);
    if (!isPreview) { drawDot(x1, y1, "#3FA796"); drawDot(x2, y2, "#3FA796"); }
    dctx.globalAlpha = 1;
  } else if (d.type === "fib") {
    const [p1, p2] = d.points;
    const x1 = timeToX(p1.time), y1 = priceToY(p1.price);
    const x2 = timeToX(p2.time), y2 = priceToY(p2.price);
    if (x1 === null || y1 === null || x2 === null || y2 === null) return;
    const left = Math.min(x1, x2), right = Math.max(x1, Math.max(x1, x2)) + (isPreview ? 0 : 40);
    const rightEdge = Math.max(x1, x2, rect.width);
    dctx.globalAlpha = alpha;
    FIB_LEVELS.forEach((lvl, i) => {
      const price = p1.price + (p2.price - p1.price) * lvl;
      const y = priceToY(price);
      if (y === null) return;
      drawLine(Math.min(x1, x2), y, isPreview ? Math.max(x1, x2) : rightEdge, y, FIB_COLORS[i], 1, i === 0 || i === 6 ? [] : [4, 3]);
      drawLabel(Math.min(x1, x2) === x1 ? Math.min(x1,x2) : Math.min(x1,x2), y, lvl.toFixed(3) + "  " + price.toFixed(2), FIB_COLORS[i]);
    });
    drawLine(x1, y1, x2, y2, "#6B768088", 1, [2, 2]);
    dctx.globalAlpha = 1;
  } else if (d.type === "hline") {
    const p = d.points[0];
    const y = priceToY(p.price);
    if (y === null) return;
    drawLine(0, y, rect.width, y, "#E8C468", 1.5, [6, 3]);
    drawLabel(rect.width - 90, y, p.price.toFixed(2), "#E8C468");
  } else if (d.type === "text") {
    const p = d.points[0];
    const x = timeToX(p.time), y = priceToY(p.price);
    if (x === null || y === null) return;
    dctx.save();
    dctx.font = "600 12px 'Inter', sans-serif";
    dctx.fillStyle = "#EDEFF1";
    dctx.fillText(d.text, x, y);
    dctx.restore();
  }
}

function commitDrawing(type, points, text) {
  const d = { type, points, text: text || "" };
  drawings.push(d);
  saveDrawings();
  pendingPoints = [];
  redrawOverlay();
}

drawCanvas.addEventListener("mousemove", (e) => {
  const rect = drawCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const time = xToTime(x), price = yToPrice(y);
  if (time === null || price === null) return;
  hoverPoint = { time, price };
  if (pendingPoints.length) redrawOverlay();
});

drawCanvas.addEventListener("click", (e) => {
  if (activeTool === "cursor") return;
  const rect = drawCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const time = xToTime(x), price = yToPrice(y);
  if (time === null || price === null) return;

  if (activeTool === "hline") {
    commitDrawing("hline", [{ time, price }]);
    return;
  }
  if (activeTool === "text") {
    const text = prompt("Label text:");
    if (text) commitDrawing("text", [{ time, price }], text);
    else pendingPoints = [];
    return;
  }
  // trend & fib need 2 points
  pendingPoints.push({ time, price });
  if (pendingPoints.length === 2) {
    commitDrawing(activeTool, pendingPoints);
  }
});

document.getElementById("toolbar").addEventListener("click", (e) => {
  const btn = e.target.closest(".tool-btn");
  if (!btn) return;
  if (btn.id === "toolClear") {
    if (confirm("Clear all drawings for " + currentSymbol + "?")) {
      drawings = [];
      saveDrawings();
      redrawOverlay();
    }
    return;
  }
  setActiveTool(btn.dataset.tool);
});

new ResizeObserver(resizeCanvas).observe(document.getElementById("chart"));

function fmt(n, d = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}

function initCharts() {
  const chartEl = document.getElementById("chart");
  const volEl = document.getElementById("volChart");

  const commonOptions = {
    layout: { background: { color: "transparent" }, textColor: "#9BA3AB", fontFamily: "'IBM Plex Mono', monospace" },
    grid: { vertLines: { color: "#20262C" }, horzLines: { color: "#20262C" } },
    rightPriceScale: { borderColor: "#2A3138" },
    timeScale: { borderColor: "#2A3138" },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  };

  chart = LightweightCharts.createChart(chartEl, {
    ...commonOptions,
    height: 460,
  });
  series = chart.addCandlestickSeries({
    upColor: "#3FA796", downColor: "#C4553D",
    borderUpColor: "#3FA796", borderDownColor: "#C4553D",
    wickUpColor: "#3FA796", wickDownColor: "#C4553D",
  });

  volChart = LightweightCharts.createChart(volEl, {
    ...commonOptions,
    height: 110,
    timeScale: { borderColor: "#2A3138", visible: true },
  });
  volSeries = volChart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "",
  });

  // Sync the two time scales together
  chart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (range) volChart.timeScale().setVisibleLogicalRange(range);
    redrawOverlay();
  });
  volChart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (range) chart.timeScale().setVisibleLogicalRange(range);
  });
  chart.subscribeCrosshairMove(() => redrawOverlay());

  new ResizeObserver(() => {
    chart.applyOptions({ width: chartEl.clientWidth });
    volChart.applyOptions({ width: volEl.clientWidth });
    resizeCanvas();
  }).observe(chartEl);

  resizeCanvas();
}

function applyRange() {
  let candles = allCandles;
  if (rangeDays > 0) {
    const cutoff = Math.floor(Date.now() / 1000) - rangeDays * 86400;
    candles = allCandles.filter((c) => c.time >= cutoff);
  }
  series.setData(candles.map((c) => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
  volSeries.setData(candles.map((c) => ({
    time: c.time,
    value: c.volume || 0,
    color: c.close >= c.open ? "rgba(63,167,150,.5)" : "rgba(196,85,61,.5)",
  })));
  chart.timeScale().fitContent();
  volChart.timeScale().fitContent();
  setTimeout(redrawOverlay, 50);

  if (candles.length) {
    const last = candles[candles.length - 1];
    const prev = candles.length > 1 ? candles[candles.length - 2] : null;
    document.getElementById("lastPrice").textContent = "Rs " + fmt(last.close, 2);
    if (prev) {
      const chg = last.close - prev.close;
      const chgPct = (chg / prev.close) * 100;
      const chgEl = document.getElementById("chgLine");
      chgEl.className = "chg " + (chg >= 0 ? "up" : "down");
      chgEl.textContent = (chg >= 0 ? "▲ +" : "▼ ") + fmt(Math.abs(chg), 2) + " (" + (chg >= 0 ? "+" : "-") + fmt(Math.abs(chgPct), 2) + "%)";
    }
  }
}

function showChartStatus(html, isErr) {
  const box = document.getElementById("chartStatus");
  const text = document.getElementById("chartStatusText");
  text.className = "status" + (isErr ? " err" : "");
  text.innerHTML = html;
  box.classList.add("show");
}
function hideChartStatus() {
  document.getElementById("chartStatus").classList.remove("show");
}

async function loadSymbol() {
  const symbol = document.getElementById("symbolInput").value.trim().toUpperCase();
  if (!symbol) return;

  showChartStatus("Loading " + symbol + "…", false);

  try {
    const res = await fetch(`${WORKER_URL}/?symbol=${encodeURIComponent(symbol)}`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.candles || !data.candles.length) throw new Error("No data returned for this symbol.");

    allCandles = data.candles;
    currentSymbol = symbol;
    if (!chart) initCharts();
    applyRange();
    loadDrawings(symbol);
    setActiveTool("cursor");
    resizeCanvas();
    hideChartStatus();
  } catch (err) {
    showChartStatus("Couldn't load " + symbol + ": " + err.message, true);
    document.getElementById("lastPrice").textContent = "—";
    document.getElementById("chgLine").textContent = "";
  }
}

document.getElementById("loadBtn").addEventListener("click", loadSymbol);
document.getElementById("symbolInput").addEventListener("keydown", (e) => { if (e.key === "Enter") loadSymbol(); });

document.getElementById("rangeRow").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-days]");
  if (!btn) return;
  document.querySelectorAll("#rangeRow .btn").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  rangeDays = Number(btn.dataset.days);
  if (allCandles.length) applyRange();
});

loadSymbol();
</script>
</body>
</html>
