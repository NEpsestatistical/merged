<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NEPSE Chart</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0B0E11; color: #EDEFF1;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; padding: 28px 20px 60px;
  }
  .label { font-family: 'Inter', sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  .ee-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-family: 'Inter', sans-serif; }
  .ee-mark { width: 26px; height: 26px; border-radius: 7px; background: #3FA796; color: #0B0E11; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .ee-brand-text { font-size: 12px; color: #6B7680; letter-spacing: .04em; }
  .ee-brand-text b { color: #EDEFF1; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
  .symbol-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .symbol-row input {
    background: #14181C; border: 1px solid #2A3138; border-radius: 7px; padding: 10px 12px;
    color: #EDEFF1; font-family: inherit; font-size: 15px; font-weight: 600; width: 140px; text-transform: uppercase;
  }
  .symbol-row input:focus { outline: none; border-color: #3FA796; }
  button { font-family: inherit; cursor: pointer; }
  .btn { display: flex; align-items: center; gap: 6px; background: #1D2329; border: 1px solid #2A3138; color: #EDEFF1; padding: 9px 14px; border-radius: 7px; font-size: 13px; }
  .btn:hover { border-color: #3A424B; }
  .btn.primary { background: #3FA796; border-color: #3FA796; color: #0D1210; font-weight: 600; }
  .btn.active { background: #1D2329; border-color: #3FA796; color: #3FA796; }

  .range-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .range-row .btn { padding: 7px 12px; font-size: 12px; }

  .price-info { font-family: 'Inter', sans-serif; }
  .price-info .last { font-size: 28px; font-weight: 600; }
  .price-info .chg { font-size: 13px; margin-top: 4px; }
  .up { color: #3FA796; } .down { color: #C4553D; }

  .chart-card { background: #1A1F24; border: 1px solid #2A3138; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  #chart { width: 100%; height: 460px; }
  #volChart { width: 100%; height: 110px; margin-top: 6px; }

  .status { font-family: 'Inter', sans-serif; font-size: 13px; color: #6B7680; text-align: center; padding: 60px 20px; }
  .status.err { color: #E8998A; }

  .footer-note { font-size: 11px; color: #4A5158; margin-top: 20px; text-align: center; font-family: 'Inter', sans-serif; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ee-brand">
    <div class="ee-mark">EE</div>
    <div class="ee-brand-text"><b>Elite Elliott</b> · Charts</div>
  </div>

  <div class="header">
    <div>
      <div class="symbol-row">
        <input type="text" id="symbolInput" value="RAWA" placeholder="SYMBOL" />
        <button class="btn primary label" id="loadBtn">↻ Load</button>
      </div>
      <div class="price-info" id="priceInfo" style="margin-top:12px;">
        <div class="last" id="lastPrice">—</div>
        <div class="chg" id="chgLine"></div>
      </div>
    </div>
    <div class="range-row" id="rangeRow">
      <button class="btn label" data-days="90">3M</button>
      <button class="btn label" data-days="180">6M</button>
      <button class="btn label active" data-days="365">1Y</button>
      <button class="btn label" data-days="730">2Y</button>
      <button class="btn label" data-days="0">All</button>
    </div>
  </div>

  <div class="chart-card">
    <div id="chart"></div>
    <div id="volChart"></div>
  </div>

  <div class="footer-note">
    Daily OHLC, proxied through a Worker from nepsetrading.com's public chart feed — unofficial, verify before trading decisions.
  </div>
</div>

<script>
const WORKER_URL = "https://nepsechart.bharatiaashish43.workers.dev";

let allCandles = [];
let chart, series, volChart, volSeries;
let rangeDays = 365;

function fmt(n, d = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}

function initCharts() {
  const chartEl = document.getElementById("chart");
  const volEl = document.getElementById("volChart");

  const commonOptions = {
    layout: { background: { color: "transparent" }, textColor: "#9BA3AB", fontFamily: "'IBM Plex Mono', monospace" },
    grid: { vertLines: { color: "#20262C" }, horzLines: { color: "#20262C" } },
    rightPriceScale: { borderColor: "#2A3138" },
    timeScale: { borderColor: "#2A3138" },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  };

  chart = LightweightCharts.createChart(chartEl, {
    ...commonOptions,
    height: 460,
  });
  series = chart.addCandlestickSeries({
    upColor: "#3FA796", downColor: "#C4553D",
    borderUpColor: "#3FA796", borderDownColor: "#C4553D",
    wickUpColor: "#3FA796", wickDownColor: "#C4553D",
  });

  volChart = LightweightCharts.createChart(volEl, {
    ...commonOptions,
    height: 110,
    timeScale: { borderColor: "#2A3138", visible: true },
  });
  volSeries = volChart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "",
  });

  // Sync the two time scales together
  chart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (range) volChart.timeScale().setVisibleLogicalRange(range);
  });
  volChart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (range) chart.timeScale().setVisibleLogicalRange(range);
  });

  new ResizeObserver(() => {
    chart.applyOptions({ width: chartEl.clientWidth });
    volChart.applyOptions({ width: volEl.clientWidth });
  }).observe(chartEl);
}

function applyRange() {
  let candles = allCandles;
  if (rangeDays > 0) {
    const cutoff = Math.floor(Date.now() / 1000) - rangeDays * 86400;
    candles = allCandles.filter((c) => c.time >= cutoff);
  }
  series.setData(candles.map((c) => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
  volSeries.setData(candles.map((c) => ({
    time: c.time,
    value: c.volume || 0,
    color: c.close >= c.open ? "rgba(63,167,150,.5)" : "rgba(196,85,61,.5)",
  })));
  chart.timeScale().fitContent();
  volChart.timeScale().fitContent();

  if (candles.length) {
    const last = candles[candles.length - 1];
    const prev = candles.length > 1 ? candles[candles.length - 2] : null;
    document.getElementById("lastPrice").textContent = "Rs " + fmt(last.close, 2);
    if (prev) {
      const chg = last.close - prev.close;
      const chgPct = (chg / prev.close) * 100;
      const chgEl = document.getElementById("chgLine");
      chgEl.className = "chg " + (chg >= 0 ? "up" : "down");
      chgEl.textContent = (chg >= 0 ? "▲ +" : "▼ ") + fmt(Math.abs(chg), 2) + " (" + (chg >= 0 ? "+" : "-") + fmt(Math.abs(chgPct), 2) + "%)";
    }
  }
}

async function loadSymbol() {
  const symbol = document.getElementById("symbolInput").value.trim().toUpperCase();
  if (!symbol) return;

  const chartEl = document.getElementById("chart");
  chartEl.innerHTML = '<div class="status">Loading ' + symbol + '…</div>';
  document.getElementById("volChart").innerHTML = "";

  try {
    const res = await fetch(`${WORKER_URL}/?symbol=${encodeURIComponent(symbol)}`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.candles || !data.candles.length) throw new Error("No data returned for this symbol.");

    chartEl.innerHTML = "";
    allCandles = data.candles;
    if (!chart) initCharts();
    applyRange();
  } catch (err) {
    chartEl.innerHTML = '<div class="status err">Couldn\'t load ' + symbol + ': ' + err.message + '</div>';
    document.getElementById("lastPrice").textContent = "—";
    document.getElementById("chgLine").textContent = "";
  }
}

document.getElementById("loadBtn").addEventListener("click", loadSymbol);
document.getElementById("symbolInput").addEventListener("keydown", (e) => { if (e.key === "Enter") loadSymbol(); });

document.getElementById("rangeRow").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-days]");
  if (!btn) return;
  document.querySelectorAll("#rangeRow .btn").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  rangeDays = Number(btn.dataset.days);
  if (allCandles.length) applyRange();
});

loadSymbol();
</script>
</body>
</html>
